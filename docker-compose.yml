services:
  # ========================================
  # REDIS - Caching
  # ========================================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ========================================
  # EUREKA SERVER - Service Discovery
  # ========================================
  eureka:
    image: ${EUREKA_IMAGE}
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ========================================
  # API GATEWAY - Entry Point
  # ========================================
  api-gateway:
    image: ${API_GATEWAY_IMAGE}
    container_name: api-gateway
    # ports:
    #   - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ========================================
  # USER SERVICE
  # ========================================
  user-service:
    image: ${USER_SERVICE_IMAGE}
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # PROFILE MANAGEMENT SERVICE
  # ========================================
  profile-management-service:
    image: ${PROFILE_SERVICE_IMAGE}
    container_name: profile-management-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # CLUB SERVICE
  # ========================================
  club-service:
    image: ${CLUB_SERVICE_IMAGE}
    container_name: club-service
    ports:
      - "8083:8083"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - PORT=8083
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # INDEPENDENT SERVICE
  # ========================================
  independent-service:
    image: ${INDEPENDENT_SERVICE_IMAGE}
    container_name: independent-service
    ports:
      - "8085:8085"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # EVENT SERVICE
  # ========================================
  event-service:
    image: ${EVENT_SERVICE_IMAGE}
    container_name: event-service
    ports:
      - "8086:8086"
    environment:
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - PORT=8086
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # FRONTEND - React App (nginx)
  # ========================================
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - microservices-network
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

# ========================================
# NETWORKS
# ========================================
networks:
  microservices-network:
    driver: bridge

# ========================================
# VOLUMES
# ========================================
volumes:
  maven-cache:
