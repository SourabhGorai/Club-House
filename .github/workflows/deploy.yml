# ============================================================
# CI/CD — Build, Push to Docker Hub & Deploy to VM
# ============================================================
#
# Required GitHub Secrets (Settings → Secrets → Actions):
# ┌─────────────────────────────┬──────────────────────────────────────────┐
# │ Secret                      │ Description                              │
# ├─────────────────────────────┼──────────────────────────────────────────┤
# │ DOCKERHUB_USERNAME          │ Docker Hub username                      │
# │ DOCKERHUB_TOKEN             │ Docker Hub access token (not password)   │
# │ VM_HOST                     │ VM IP address or hostname                │
# │ VM_USER                     │ SSH username on the VM                   │
# │ VM_SSH_KEY                  │ Private SSH key (PEM format)             │
# │ VM_SSH_PORT                 │ SSH port (optional, defaults to 22)      │
# │ SPRING_DATASOURCE_URL       │ jdbc:postgresql://host:5432/db           │
# │ DB_URL                      │ jdbc:postgresql://host:5432/db           │
# │ DB_USER                     │ Database username                        │
# │ DB_PASS                     │ Database password                        │
# │ SECRET_KEY                  │ JWT secret key                           │
# │ MAIL_USER                   │ SMTP email address                       │
# │ MAIL_PASS                   │ SMTP email password / app password       │
# └─────────────────────────────┴──────────────────────────────────────────┘

name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main,redis]
  workflow_dispatch:

jobs:
  # ============================================================
  # BUILD & PUSH — BACKEND SERVICES (parallel matrix)
  # ============================================================
  build-backend:
    name: Build & Push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eureka-server
            context: ./Backend/eureka
          - name: api-gateway
            context: ./Backend/api-gateway
          - name: user-service
            context: ./Backend/user-service
          - name: profile-management-service
            context: ./Backend/profile-management-service
          - name: club-service
            context: ./Backend/club-service2
          - name: independent-service
            context: ./Backend/independent-services
          - name: event-service
            context: ./Backend/event-service2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ============================================================
  # BUILD & PUSH — FRONTEND
  # ============================================================
  build-frontend:
    name: Build & Push — frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/react-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================
  # DEPLOY — SSH into VM, write .env, docker compose up
  # ============================================================
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          source: docker-compose.yml
          target: ~/app/

      - name: Write .env and restart services
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          envs: SHA,DOCKERHUB_USERNAME,SPRING_DATASOURCE_URL,DB_URL,DB_USER,DB_PASS,SECRET_KEY,MAIL_USER,MAIL_PASS
          script: |
            set -e
            cd ~/app

            # Write .env with all secrets and image references
            cat > .env << EOF
            IMAGE_TAG=${SHA}

            EUREKA_IMAGE=${DOCKERHUB_USERNAME}/eureka-server:${SHA}
            API_GATEWAY_IMAGE=${DOCKERHUB_USERNAME}/api-gateway:${SHA}
            USER_SERVICE_IMAGE=${DOCKERHUB_USERNAME}/user-service:${SHA}
            PROFILE_SERVICE_IMAGE=${DOCKERHUB_USERNAME}/profile-management-service:${SHA}
            CLUB_SERVICE_IMAGE=${DOCKERHUB_USERNAME}/club-service:${SHA}
            INDEPENDENT_SERVICE_IMAGE=${DOCKERHUB_USERNAME}/independent-service:${SHA}
            EVENT_SERVICE_IMAGE=${DOCKERHUB_USERNAME}/event-service:${SHA}
            FRONTEND_IMAGE=${DOCKERHUB_USERNAME}/frontend:${SHA}

            DB_HOST=host.docker.internal
            DB_PORT=5432
            DB_NAME=club_user
            SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
            DB_URL=${DB_URL}
            DB_USER=${DB_USER}
            DB_PASS=${DB_PASS}

            SECRET_KEY=${SECRET_KEY}

            MAIL_USER=${MAIL_USER}
            MAIL_PASS=${MAIL_PASS}
            EOF

            # Pull new images (fail fast if any image is missing)
            docker-compose pull

            # Restart services with zero-downtime rolling update
            docker-compose up -d --remove-orphans

            # Remove dangling images to free disk space
            docker image prune -f
