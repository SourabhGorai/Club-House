services:
  # ========================================
  # EUREKA SERVER - Service Discovery
  # ========================================
  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ========================================
  # API GATEWAY - Entry Point
  # ========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ========================================
  # USER SERVICE
  # ========================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/club_user
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # PROFILE MANAGEMENT SERVICE
  # ========================================
  profile-management-service:
    build:
      context: ./profile-management-service
      dockerfile: Dockerfile
    container_name: profile-management-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/club_user
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # CLUB SERVICE
  # ========================================
  club-service:
    build:
      context: ./club-service2
      dockerfile: Dockerfile
    container_name: club-service
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://host.docker.internal:5432/club_user
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - PORT=8083
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # INDEPENDENT SERVICE
  # ========================================
  independent-service:
    build:
      context: ./independent-services
      dockerfile: Dockerfile
    container_name: independent-service
    ports:
      - "8085:8085"
    environment:
      - DB_URL=jdbc:postgresql://host.docker.internal:5432/club_user
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================
  # EVENT SERVICE
  # ========================================
  event-service:
    build:
      context: ./event-service2
      dockerfile: Dockerfile
    container_name: event-service
    ports:
      - "8086:8086"
    environment:
      - DB_URL=jdbc:postgresql://host.docker.internal:5432/club_user
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - PORT=8086
    networks:
      - microservices-network
    depends_on:
      eureka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

# ========================================
# NETWORKS
# ========================================
networks:
  microservices-network:
    driver: bridge

# ========================================
# VOLUMES (for future use if needed)
# ========================================
volumes:
  maven-cache: