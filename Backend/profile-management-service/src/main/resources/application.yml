# Server Configuration
server:
  port: 8082

# PostgreSQL Database Configuration
spring:
  application:
    name: profile-management-service

  datasource:
    url: jdbc:postgresql://localhost:5432/club_user
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500KB
      max-request-size: 500KB

logging:
  level:
    root: INFO
    com:
      college:
        profile_management: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
