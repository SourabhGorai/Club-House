spring:
  application:
    name: notification-service2

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club_user}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    loadbalancer:
      ribbon:
        enabled: false

  data:
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis
      redis:
        time-to-live: 600000 # 10 min

server:
  port: ${PORT:8087}
  error:
    include-message: always
    include-binding-errors: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

#eureka:
#  client:
#    service-url:
#      defaultZone: http://eureka:8761/eureka/

logging:
  level:
    com.clubservice: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  profile-service:
    url: http://PROFILE-MANAGEMENT-SERVICE/api
  club-service:
    url: http://CLUB-SERVICE2/api
  event-service:
    url: http://EVENT-SERVICE2/api
  independent-service:
    url: http://INDEPENDENT-SERVICES/api

  jwt:
    secret: ${SECRET_KEY}