spring:
  application:
    name: api-gateway

  # Enable Caffeine cache for LoadBalancer
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ========== USER SERVICE ROUTES ==========

            # Auth endpoints (public - no authentication required)
            - id: user-service-auth
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0

            # User management endpoints (protected)
            - id: user-service-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=0
                - AuthenticationFilter

            # Profile Management Service
            - id: profile-management-service
              uri: lb://PROFILE-MANAGEMENT-SERVICE
              predicates:
                - Path=/api/profiles/**
              filters:
                - StripPrefix=0
                - AuthenticationFilter

            # CLUB-SERVICE

            # Profile Management Service
            - id: club-service-management
              uri: lb://CLUB-SERVICE2
              predicates:
                - Path=/api/clubs/**
              filters:
                - StripPrefix=0
                - AuthenticationFilter

            # Profile Management Service
            - id: club-service-assigning
              uri: lb://CLUB-SERVICE2
              predicates:
                - Path=/api/user-clubs/**
              filters:
                - StripPrefix=0
                - AuthenticationFilter

            # ========== ADD MORE SERVICES HERE ==========

            # Example: Club Service (uncomment when ready)
            # - id: club-service
            #   uri: lb://club-service
            #   predicates:
            #     - Path=/api/clubs/**
            #   filters:
            #     - StripPrefix=0
            #     - AuthenticationFilter

            # Example: Team Service (uncomment when ready)
            # - id: team-service
            #   uri: lb://team-service
            #   predicates:
            #     - Path=/api/teams/**
            #   filters:
            #     - StripPrefix=0
            #     - AuthenticationFilter

          # Global CORS configuration
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders:
                  - Authorization
                allowCredentials: true
                maxAge: 3600

          # Enable discovery locator
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 8080

# JWT Configuration (MUST match user-service secret)
jwt:
  secret: thisismysecretkeywhichihaveevercreatedformyprojectandthisissupposedtobeusedformyfinalyearproject

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: localhost

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"