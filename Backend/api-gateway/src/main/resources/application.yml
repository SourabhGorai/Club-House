spring:
  application:
    name: api-gateway

  cloud:
    loadbalancer:
      cache:
        caffeine:
          spec: maximumSize=500,expireAfterWrite=600s

server:
  port: 8080

# JWT Configuration (MUST match user-service secret)
jwt:
  secret: ${SECRET_KEY}

# ===============================
# Eureka Client Configuration
# ===============================
eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8761/eureka/
#    fetch-registry: true
#    register-with-eureka: true
#  instance:
#    prefer-ip-address: true

# ===============================
# Actuator Configuration
# ===============================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
          - routes
  endpoint:
    health:
      show-details: always
    gateway:
      access: read_only

# ===============================
# Logging Configuration
# ===============================
logging:
  level:
    root: INFO
    com.gateway: DEBUG
    com.gateway.api_gateway.filter: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Profile Management Service
        url: /profile-management-service/v3/api-docs
      - name: Independent Service
        url: /independent-service/v3/api-docs
      - name: Club Service
        url: /club-service2/v3/api-docs
      - name: Event Service
        url: /event-service2/v3/api-docs
      - name: Notification Service
        url: /notification-service2/v3/api-docs
  api-docs:
    enabled: true

